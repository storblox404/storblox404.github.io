<!-- Pemantau milik StoreBlox (bukan kode Adsterra): memberi kabar ke halaman utama apakah skrip iklan berhasil dimuat. -->
<script>
(function () {
  function say(t) { try { parent.postMessage({ sbxad: t }, '*'); } catch (e) { /* abaikan */ } }
  window.addEventListener('error', function (e) {
    var t = e && e.target;
    if (t && t.tagName === 'SCRIPT' && /^https?:/.test(t.src || '')) { say('adfail'); }
  }, true);
  window.addEventListener('load', function (e) {
    var t = e && e.target;
    if (t && t.tagName === 'SCRIPT' && /^https?:/.test(t.src || '')) { say('adok'); }
  }, true);
})();
</script>
